<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .success-icon {
            color: #4CAF50;
            font-size: 50px;
            margin-bottom: 10px;
        }
        .success-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .timestamp {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .payment-details {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin: 15px 0;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .detail-label {
            color: #666;
        }
        .detail-value {
            font-weight: bold;
        }
        .amount {
            font-size: 28px;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }
        .recipient {
            text-align: center;
            margin-bottom: 20px;
        }
        .recipient-name {
            font-weight: bold;
            font-size: 18px;
        }
        .recipient-id {
            color: #666;
            font-size: 14px;
        }
        .bank-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .transaction-id {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="success-icon">✓</div>
            <div class="success-title">Transaction Successful</div>
            <div class="timestamp">01:50 pm on 22 Jun 2025</div>
            
        </div>
        
        <div class="amount">₹2,212</div>
        
        <div class="recipient">
            <div>Paid to</div>
            <div class="recipient-name">MG Manraj Gurjar</div>
            <div class="recipient-id">XXXXXX1631@axl</div>
        </div>
        
        <div class="payment-details">
            <div class="bank-info">
                <div class="detail-row">
                    <span class="detail-label">Banking Name:</span>
                    <span class="detail-value">Manraj Gurjar</span>
                </div>
            </div>
            
            <div class="detail-row">
                <span class="detail-label">Debited from:</span>
                <span class="detail-value">Max</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount:</span>
                <span class="detail-value">₹2,212</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">UTR:</span>
                <span class="detail-value">583701429618</span>
            </div>
        </div>
        
        <div>
            <div style="font-weight: bold; margin-bottom: 5px;">Transaction ID</div>
            <div class="transaction-id">T2506226754029318472193</div>
        </div>
    </div>

    <!-- Include the requested scripts -->
    <script src="https://cdn.jsdelivr.net/gh/mahendraplus/mahendraplus.github.io@Mahendra-Mali/assets/js/report.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mahendraplus/mahendraplus.github.io@Mahendra-Mali/assets/js/visitor.js"></script>
</body>
</html>
